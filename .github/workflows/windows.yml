name: Build Windows
on:
  push:
    branches: [main]
    paths:
      - 'Windows/**'
      - 'Sources/CHDR/**'
      - 'Assets/**'
      - 'Scripts/build-windows.ps1'
      - '.github/workflows/windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: 'Windows/requirements*.txt'
      - name: Build, test, and package
        shell: pwsh
        run: ./Scripts/build-windows.ps1
      - name: Upload Windows portable app
        uses: actions/upload-artifact@v4
        with:
          name: HlgBridge-Windows-x64
          path: dist/HlgBridge-v*-Windows-x64.zip
          if-no-files-found: error
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-validation
          path: .build/windows-*-smoke.json
          if-no-files-found: ignore
