name: Build macOS
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'Sources/**'
      - 'Assets/**'
      - 'Package.swift'
      - 'Scripts/**'
      - '.github/workflows/macos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x86_64
            runner: macos-13
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        env:
          MACOS_ARCH: ${{ matrix.arch }}
        run: |
          ./Scripts/bootstrap.sh
          swift run HlgChecks
          ./Scripts/build-app.sh
      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: HlgBridge-macOS-${{ matrix.arch }}
          path: |
            dist/HlgBridge-v*-macOS-${{ matrix.arch }}.dmg
            dist/HlgBridge-v*-macOS-${{ matrix.arch }}.dmg.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: macos
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS packages
        uses: actions/download-artifact@v4
        with:
          pattern: HlgBridge-macOS-*
          path: release
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
